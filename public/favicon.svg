<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.6" />

  <!-- Outer Glow Hexagon / Frame -->
  <path d="M256 64 L416 160 V352 L256 448 L96 352 V160 Z" fill="none" stroke="url(#accentGrad)" stroke-width="12" filter="url(#glow)" opacity="0.8" />

  <!-- Inner Monogram K & Terminal Code Symbol -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- K Stem -->
    <line x1="180" y1="140" x2="180" y2="372" />
    <!-- K Upper Diagonal / Prompt -->
    <path d="M330 150 L180 256 L330 362" />
  </g>

  <!-- Glowing Accent Dot -->
  <circle cx="350" cy="150" r="16" fill="#38bdf8" filter="url(#glow)" />
</svg>